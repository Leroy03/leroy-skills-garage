{
  "version": 2,
  "principles": [
    "minimal_scope",
    "reuse_existing",
    "verify_with_evidence",
    "preserve_user_authorization"
  ],
  "defaults": {
    "response_style": {
      "concise": true,
      "evidence_first": true
    },
    "file_encoding": {
      "text": "utf-8",
      "bom": false
    }
  },
  "grades": {
    "⚪": {
      "level": "L0",
      "process": "direct_answer",
      "required_skills": []
    },
    "🟢": {
      "level": "L1",
      "process": "minimal_execution",
      "required_skills": [],
      "verification": "direct_evidence"
    },
    "🟡": {
      "level": "L2",
      "process": "planned_and_reviewed",
      "required_skills": [],
      "optional_skills": [
        "work-planning",
        "engineering-review",
        "delivery-evidence",
        "devflow-marshal"
      ],
      "stop": "Reviewed=Approved unless user has explicitly continued",
      "verification": "project_required_evidence"
    },
    "🔴": {
      "level": "L3",
      "process": "governed_delivery",
      "required_skills": [
        "devflow-marshal"
      ],
      "optional_skills": [
        "work-planning",
        "engineering-review",
        "delivery-evidence",
        "project-memory"
      ],
      "verification": "project_state_machine"
    }
  },
  "roles": {
    "work-planning": {
      "purpose": "scope, tradeoffs, dependencies, acceptance"
    },
    "engineering-review": {
      "purpose": "evidence-backed findings and limits"
    },
    "delivery-evidence": {
      "purpose": "verification, test results, completion decision"
    },
    "project-memory": {
      "purpose": "durable facts and source-linked summaries"
    },
    "devflow-marshal": {
      "purpose": "run, contracts, audit and archive"
    }
  },
  "compatibility": {
    "entry-router": "direct triage; work-planning or devflow-marshal only when needed",
    "grill-lite": "work-planning"
  },
  "rules": [
    "Current user instructions and project rules determine scope and gates.",
    "Only load relevant skills, never a mandatory chain for ordinary tasks.",
    "Keep planning approval separate from Runtime and visual acceptance."
  ]
}
